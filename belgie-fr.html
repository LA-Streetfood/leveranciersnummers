<script>
  /*
   * LET OP: de artikelnummers beheer je niet meer in de code.
   *
   * Deze pagina haalt bij het laden de rijen met Land = BE op; waar die
   * vandaan komen staat in leveranciers-bron.js (het Excel-bestand in
   * SharePoint, of anders de Google Sheet). De lijst in leveranciers-belgie.js

   *
   * Een leeg veld toont automatisch een rood kruisje.
   * Zodra alle 8 artikelnummers zijn ingevuld, krijgt de leverancier
   * automatisch een groen vinkje.
   *
   * De LA-codes in de kolomkoppen zijn:
   * LA152, LA824, LA768, LA823, LA7600, LA882, LA979 en LA115.
   *
   * Deze versie bevat alleen de BELGISCHE leveranciers.
   * De Nederlandse leveranciers staan in index.html.
   * De lijst wordt automatisch alfabetisch gesorteerd.
   */

  /* De leverancierslijst staat in leveranciers-belgie.js (gedeeld met de Franse versie belgie-fr.html). */

  /*
   * De lijst hierboven is alleen de terugval. Normaal wordt hij direct na
   * het laden vervangen door de actuele lijst uit de Google Sheet.
   */
  let activeSuppliers = suppliers;

  const body = document.getElementById("supplierBody");
  const filter = document.getElementById("supplierFilter");
  const emptyState = document.getElementById("emptyState");


  function supplierInitials(name) {
    const cleaned = name
      .replace(/&/g, " ")
      .replace(/[^\p{L}\p{N}\s]/gu, " ")
      .trim();

    const parts = cleaned.split(/\s+/).filter(Boolean);
    if (!parts.length) return "LA";

    const first = parts[0][0] || "";
    const second = parts.length > 1 ? (parts[1][0] || "") : "";
    return (first + second).toUpperCase();
  }

  /*

   * };
   */

    degroot: "degroot.svg",
    chefs: "chefs.svg",
    jansma: "jansma.svg",
    pastridor: "pastridor.webp",
    logo_text: "logo_text.svg",
    conway: "conway.png",

    actifood: "https://burghgraefgehaktballen.nl/cdn/shop/files/Logo_VHC_ActiFood_-geelvlak_RGB.jpg?v=1749212645&width=3200",

   * Voor de leveranciers hieronder gebruiken we het icoontje (favicon)

  /*
   * Voor het mini-logo proberen we meerdere bronnen na elkaar:

   */
  function faviconSources(domain) {
    return [
      "https://icons.duckduckgo.com/ip3/" + domain + ".ico",
      "https://" + domain + "/favicon.ico",
      "https://www." + domain + "/favicon.ico",
      "https://www.google.com/s2/favicons?domain=" + domain + "&sz=64"
    ];
  }

  function logoFallback(img, initials) {
    const alts = (img.dataset.alts || "").split("|").filter(Boolean);
    if (alts.length) {
      img.dataset.alts = alts.slice(1).join("|");
      img.src = alts[0];
    } else {
      img.parentElement.classList.remove("brand-logo");
      img.parentElement.textContent = initials;
    }
  }

  function getSupplierLogo(name) {
    const lower = name.toLowerCase();

    if (lower.includes("horesca")) return supplierLogos.horesca;
    if (lower.includes("bidfood")) return supplierLogos.bidfood;
    if (lower.includes("vhc")) return supplierLogos.vhc;
    if (lower.includes("combigro helmink")) return supplierLogos.vhc;
    if (lower.includes("becker-royen")) return supplierLogos.brm;
    if (lower.includes("krikke")) return supplierLogos.krikke;
    if (lower.includes("jansen foodservice")) return supplierLogos.jansen;
    if (lower.includes("veldboer eenhoorn")) return supplierLogos.veldboer;
    if (lower.includes("de groot grootverbruik")) return supplierLogos.degroot;
    if (lower.includes("chefs culinar")) return supplierLogos.chefs;
    if (lower.includes("jansma wijhe")) return supplierLogos.jansma;
    if (lower.includes("spuntini") || lower.includes("génédis") || lower.includes("ryal distribution") || lower.includes("culinair service") || lower.includes("free foods")) return supplierLogos.logo_text;
    if (lower.includes("conway")) return supplierLogos.conway;
    if (lower.includes("makro")) return supplierLogos.makro;
    if (lower.includes("bellimmo")) return supplierLogos.bellimmo;
    if (lower.includes("horeca foods")) return supplierLogos.horecafoods;
    if (lower.includes("horeca totaal centraal magazijn")) return supplierLogos.horecatotaal;
    if (lower.includes("devisch foodservice")) return supplierLogos.devisch;
    if (lower.includes("horeca van zon") || lower.includes("horeca van zon") || lower.includes("van zon lommel") || lower.includes("van zon beerse") || lower.includes("van zon beringen") || lower.includes("van zon kampenhout") || lower.includes("van zon evergem")) return supplierLogos.vanzon;

  function supplierLogoHtml(name) {
    const initials = supplierInitials(name);
    let sources = [];
    if (localLogoFiles[name]) {
      sources = [".png", ".jpg", ".webp", ".avif"].map(ext => localLogoFiles[name] + ext);
    }
    if (supplierDomains[name]) {
      sources = sources.concat(faviconSources(supplierDomains[name]));
    } else if (!sources.length) {
      const logo = getSupplierLogo(name);
      if (logo) sources = [logo];
    }
    if (sources.length) {
      return `<span class="supplier-logo brand-logo"><img src="${sources[0]}" alt="" loading="lazy" data-alts="${sources.slice(1).join("|")}" onerror="logoFallback(this, '${initials}')"></span>`;
    }
    return `<span class="supplier-logo">${initials}</span>`;
  }

  function renderTable(term = "") {
    const q = term.trim().toLowerCase();

    const filtered = activeSuppliers
      .filter(supplier => supplier.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name, "nl", { sensitivity: "base" }));

    body.innerHTML = filtered.map(supplier => {
      const completed = supplier.products.filter(value => String(value).trim() !== "").length;
      const allDone = completed === supplier.products.length;
      const isLaWebshop = supplier.name === "LA Streetfood webshop & groothandel";

      const productCells = supplier.products.map(articleNumber => {
        const value = String(articleNumber || "").trim();
        return `
          <td>
            ${value
              ? `<span class="article-number">${value}</span>`
              : `<span class="not-available-x" title="Pas encore disponible" aria-label="Pas encore disponible">×</span>`
            }
          </td>
        `;
      }).join("");

      const status = allDone
        ? `<span class="check-badge" title="Tous les articles cr&eacute;&eacute;s" aria-label="Tous les articles cr&eacute;&eacute;s">✔</span>`
        : `<span class="badge progress ${completed === 0 ? "zero" : ""}">${completed} / ${supplier.products.length}</span>
           <div class="progress-note">articles cr&eacute;&eacute;s</div>`;

      const rowClasses = [
        allDone ? "future-ready" : "",
        isLaWebshop && !allDone ? "la-webshop" : ""
      ].filter(Boolean).join(" ");

      return `
        <tr class="${rowClasses}">
          <td><div class="supplier-cell">${supplierLogoHtml(supplier.name)}<span class="supplier-name">${supplier.name}</span></div></td>
          ${productCells}
          <td class="status-cell">${status}</td>
        </tr>
      `;
    }).join("");
emptyState.style.display = filtered.length ? "none" : "block";
  }

  filter.addEventListener("input", event => renderTable(event.target.value));

  renderTable();

  /*
   * Haal daarna de actuele nummers op (zie leveranciers-bron.js: eerst het
   * bestand dat vanuit SharePoint wordt bijgewerkt, anders de Google Sheet).
   * Lukt geen van beide, dan blijft de lijst hierboven staan.
   */
  laLaadLeveranciers("BE").then(list => {
    if (!list) return;
    activeSuppliers = list;
    renderTable(filter.value);
  });

  /*
   * Als deze pagina in een iframe staat (bijv. op la-streetfood.nl),
   * geeft hij zijn eigen hoogte door aan de bovenliggende pagina.
   * Zo krijgt het iframe automatisch de juiste hoogte, ook als de
   * lijst groeit of er gefilterd wordt.
   */
  if (window.parent !== window) {
    const postHeight = () => {
      parent.postMessage(
        { type: "la-embed-height", height: Math.ceil(document.body.getBoundingClientRect().height) + 2 },
        "*"
      );
    };
    new ResizeObserver(postHeight).observe(document.body);
    window.addEventListener("load", postHeight);
    postHeight();
  }
</script>
</body>
</html>
