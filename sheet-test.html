<!DOCTYPE html>
<!--
  Testpagina. Laat zien wat Google precies terugstuurt en hoe de pagina dat
  leest. Handig als de nummers op de site niet kloppen. Niet bedoeld voor
  bezoekers; hij staat nergens in het menu.
-->
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test: wat stuurt de Google Sheet terug?</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    color: #17221c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .intro { color: #6b746f; margin: 0 0 20px; }
  section {
    border: 1px solid #e8dfcf;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .status { font-weight: 700; }
  .goed { color: #24513c; }
  .fout { color: #b9473f; }
  .bezig { color: #6b746f; }
  pre {
    background: #f6f4ef;
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 8px 0 0;
  }
  button {
    font: inherit;
    font-weight: 700;
    background: #24513c;
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
  }
  #kopieerMelding { margin-left: 10px; color: #24513c; font-weight: 700; }
</style>
</head>
<body>

<h1>Test: wat stuurt de Google Sheet terug?</h1>
<p class="intro">
  Deze pagina haalt de Sheet op dezelfde twee manieren op als de echte pagina,
  en toont onbewerkt wat er terugkomt. Klik onderaan op <em>Kopieer alles</em>
  en plak dat in het gesprek.
</p>

<div id="bronnen"></div>

<section>
  <h2>Wat de pagina daarvan maakt</h2>
  <pre id="uitkomst">—</pre>
</section>

<p>
  <button id="kopieer">Kopieer alles</button>
  <span id="kopieerMelding"></span>
</p>

<script src="leveranciers-sheet.js"></script>
<script>
  const uitkomsten = [];
  const bronnenEl = document.getElementById("bronnen");

  function sectie(titel) {
    const el = document.createElement("section");
    el.innerHTML = '<h2></h2><div class="status bezig">bezig…</div><pre>—</pre>';
    el.querySelector("h2").textContent = titel;
    bronnenEl.appendChild(el);
    return {
      status: (tekst, klasse) => {
        const s = el.querySelector(".status");
        s.textContent = tekst;
        s.className = "status " + klasse;
      },
      tekst: waarde => { el.querySelector("pre").textContent = waarde; }
    };
  }

  function eersteRegels(tekst, aantal) {
    return tekst.split("\n").slice(0, aantal).map((regel, i) =>
      "regel " + (i + 1) + ": " + (regel.length > 300 ? regel.slice(0, 300) + " […]" : regel)
    ).join("\n");
  }

  function beschrijf(naam, lijst) {
    if (!lijst || !lijst.length) return naam + ": niets bruikbaars";
    const gevuld = lijst.reduce((totaal, leverancier) =>
      totaal + leverancier.products.filter(waarde => String(waarde).trim() !== "").length, 0);
    return naam + ": " + lijst.length + " leveranciers, " + gevuld + " ingevulde nummers";
  }

  /* Elk CSV-adres apart proberen, zodat zichtbaar is welk adres wat oplevert. */
  const stappen = laSheetBronnen().map(bron => () => {
    const vak = sectie("CSV — " + bron.naam);
    return fetch(bron.url, { cache: "no-store" })
      .then(antwoord => {
        if (!antwoord.ok) throw new Error("status " + antwoord.status);
        return antwoord.text();
      })
      .then(tekst => {
        const rijen = laParseCsv(tekst);
        let samenvatting;
        try {
          const nl = laRowsToSuppliers(rijen, "NL");
          const be = laRowsToSuppliers(rijen, "BE");
          samenvatting = beschrijf("Nederland", nl) + "\n" + beschrijf("Belgie", be);
          const biervliet = be.filter(l => l.name.indexOf("Biervliet") === 0)[0];
          if (biervliet) samenvatting += "\nBiervliet: [" + biervliet.products.join(" | ") + "]";
        } catch (fout) {
          samenvatting = "omzetten mislukt: " + fout.message;
        }
        vak.status("gelukt — " + tekst.length + " tekens", "goed");
        vak.tekst(eersteRegels(tekst, 3) + "\n\n" + samenvatting);
        uitkomsten.push(bron.naam + " — gelukt\n" + eersteRegels(tekst, 2) + "\n" + samenvatting);
      })
      .catch(fout => {
        vak.status("mislukt — " + fout.message, "fout");
        vak.tekst(String(fout));
        uitkomsten.push(bron.naam + " — mislukt: " + fout.message);
      });
  });

  /* En daarna de manier via een script-element. */
  stappen.push(() => new Promise(klaarmee => {
    const vak = sectie("Via een script-element");
    const naam = "laTestAntwoord";
    const afgebroken = setTimeout(() => {
      vak.status("mislukt — geen antwoord binnen 10 seconden", "fout");
      uitkomsten.push("script-element — geen antwoord binnen 10 seconden");
      klaarmee();
    }, 10000);

    window[naam] = antwoord => {
      clearTimeout(afgebroken);
      const tabel = (antwoord || {}).table || {};
      const koppen = (tabel.cols || []).map(kolom => String((kolom || {}).label || "").trim());
      const typen = (tabel.cols || []).map(kolom => (kolom || {}).type);
      vak.status("gelukt — " + koppen.length + " kolommen, " + (tabel.rows || []).length + " rijen", "goed");
      vak.tekst("koppen: " + JSON.stringify(koppen) + "\n\nkolomsoorten: " + JSON.stringify(typen) +
        "\n\neerste rij onbewerkt:\n" + JSON.stringify((tabel.rows || [])[0]));
      uitkomsten.push("script-element — koppen: " + JSON.stringify(koppen) +
        "\nkolomsoorten: " + JSON.stringify(typen));
      klaarmee();
    };

    const script = document.createElement("script");
    script.onerror = () => {
      clearTimeout(afgebroken);
      vak.status("mislukt — Sheet niet bereikbaar", "fout");
      uitkomsten.push("script-element — Sheet niet bereikbaar");
      klaarmee();
    };
    script.src = "https://docs.google.com/spreadsheets/d/" + LA_SHEET_ID +
      "/gviz/tq?tqx=out:json;responseHandler:" + naam + "&headers=1&t=" + Date.now();
    document.head.appendChild(script);
  }));

  stappen.reduce((rij, stap) => rij.then(stap), Promise.resolve()).then(() =>
    Promise.all([laLoadSuppliersFromSheet("NL"), laLoadSuppliersFromSheet("BE")])
  ).then(([nl, be]) => {
    uitkomsten.push(beschrijf("Wat de site uiteindelijk toont — Nederland", nl));
    uitkomsten.push(beschrijf("Wat de site uiteindelijk toont — Belgie", be));
    document.getElementById("uitkomst").textContent = uitkomsten.join("\n\n");
  });

  document.getElementById("kopieer").addEventListener("click", () => {
    const alles = Array.from(document.querySelectorAll("section")).map(el =>
      el.querySelector("h2").textContent + "\n" +
      el.querySelector(".status").textContent + "\n" +
      el.querySelector("pre").textContent).join("\n\n");
    navigator.clipboard.writeText(alles).then(
      () => { document.getElementById("kopieerMelding").textContent = "gekopieerd"; },
      () => { document.getElementById("kopieerMelding").textContent = "kopiëren lukte niet — maak een schermafdruk"; }
    );
  });
</script>

</body>
</html>
